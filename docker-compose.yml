version: '3.8'

services:
  neo4j:
    image: neo4j:5.12.0
    container_name: mem1-neo4j
    ports:
      - "7474:7474" # Neo4j Browser HTTP
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/mem1password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
